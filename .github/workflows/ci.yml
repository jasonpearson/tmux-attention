name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - uses: jdx/mise-action@v2
        with:
          tool_versions: |
            fzf 0.65.2
      - name: Acceptance, terminal, package and mise tests
        run: |
          # Exercise every env-bash entry point with Bash 3.2 on macOS too.
          if [ "${{ runner.os }}" = macOS ]; then
            mkdir -p "$RUNNER_TEMP/bash3"
            ln -s /bin/bash "$RUNNER_TEMP/bash3/bash"
            export PATH="$RUNNER_TEMP/bash3:$PATH"
          fi
          # Terminal tests cd outside this checkout's .tool-versions scope.
          # Activate real tool paths so fzf remains available there.
          mise exec -- /bin/bash tests/run-tests.sh
