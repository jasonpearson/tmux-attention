name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: bash
        run: |
          version=$(<VERSION)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME must match VERSION (v$version)" >&2
            exit 1
          fi
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: jdx/mise-action@v2
        with:
          tool_versions: |
            fzf 0.73.0
      - name: Acceptance and package tests
        run: mise exec -- /bin/bash tests/run-tests.sh
      - name: Build universal release
        run: bash scripts/package.sh
      - name: Publish archive and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(<VERSION)
          gh release create "$GITHUB_REF_NAME" \
            "dist/tmux-attention-$version.tar.gz" dist/SHA256SUMS \
            --verify-tag --title "tmux-attention $version" --generate-notes
